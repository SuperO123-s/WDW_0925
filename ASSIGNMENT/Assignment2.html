<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings and Formatting</title>
</head>
<body>
    <!-- b = bold, i = italic, u = underline, mark = highlight --> 
    <h1 align="center"><u>Heading 1</u></h1> 
    <h2 align="center" ><b>Heading 2</b></h2>
    <h3 align="center"><i>Heading 3</i></h3> 
    
    <p>Text with <b>bold</b>, <i>italic</i>, <u>underline</u>, <mark>mark</mark></p><br>
    H<sub>2</sub>O, x<sup>2</sup>
    
    
    <!-- Special characters (entities) -->
    <p>&copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &#8377; &hearts;</p>
    <hr> 
    

    
</body>
</html>
